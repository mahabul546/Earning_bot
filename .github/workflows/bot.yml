name: Telegram Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run Bot and Auto Save Data
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "Bot Saver"
          timeout 17400 python main.py &
          BOT_PID=$!
          echo "Bot started with PID $BOT_PID"
          while kill -0 $BOT_PID 2>/dev/null; do
            sleep 1800
            git add data.json || true
            if ! git diff --cached --quiet; then
              git commit -m "auto save data [skip ci]" || true
              git push || true
            fi
          done
          git add data.json || true
          git diff --cached --quiet || (git commit -m "final save [skip ci]" && git push)
