name: Bot Runner
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-telegram-bot
      - env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: timeout 20400 python main.py || true
